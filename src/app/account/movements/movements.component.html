@if (this.isActive) {
  @if (loading) {
    <div class="d-flex justify-content-center p-4">
      <div class="spinner-border" role="status">
        <span class="visually-hidden">Carregando...</span>
      </div>
    </div>
  } @else if (data.length > 0) {
    <div class="position-relative">
      <!-- Loading overlay for individual row operations -->
      @for (movement of data; track movement.id) {
        @if (isMovementLoading(movement.id)) {
          <div class="position-absolute top-0 start-0 w-100 h-100 d-flex justify-content-center align-items-center" style="background: rgba(255,255,255,0.7); z-index: 1000; border-radius: 4px;">
            <div class="spinner-border spinner-border-sm text-primary" role="status">
              <span class="visually-hidden">Processando...</span>
            </div>
          </div>
        }
      }
      
      <app-table
        [columns]="columns"
        [data]="data"
        (rowSelected)="onValueSelected($event)"
        [actions]="movementActions">
      </app-table>
    </div>
  } @else {
    <div class="alert alert-info m-4">
      <i class="bi bi-info-circle me-2"></i>
      Nenhum movimento encontrado
    </div>
  }
} @else {
  <div class="d-flex justify-content-between align-items-center mb-4 mt-4 ms-4 me-4">
    <h5 class="mb-0">Detalhes do Movimento</h5>
  </div>
  <router-outlet></router-outlet>
}
