<div class="container mt-5">
  <div class="card">
    <div class="card-header text-center">
      <h4>Account Details</h4>
    </div>
    @if (showMovements) {
      <app-details></app-details>
    }
    <button class="btn btn-primary btn-sm" (click)="addMovement()">Add movement</button>
  </div>
</div>
@if (showMovements) {
  <app-movements [parentId]="(1)"></app-movements>
}
