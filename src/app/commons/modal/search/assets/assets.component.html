<div class="modal-body" *ngIf="assets">
    <select [(ngModel)]="selectedOption" class="form-select">
        <option *ngFor="let asset of assets" [value]="asset.id">{{asset.ticker}}</option>
    </select>
    <div class="d-flex justify-content-center mt-3">
        <button class="btn btn-primary" (click)="close()">Select</button>
    </div>
</div>
