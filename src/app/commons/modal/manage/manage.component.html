<div class="modal-header">
    <h4 class="modal-title">{{ title }}</h4>
    <button type="button" class="btn-close" aria-label="Close" (click)="close('close')"></button>
  </div>
  <div class="modal-body">
    <p>{{ message }}</p>
  </div>
  <div class="modal-footer">
    <button type="button" class="btn btn-secondary" (click)="close('cancel')">Cancel</button>
    <button type="button" class="btn btn-secondary" (click)="close('delete')">Delete</button>
    <button type="button" class="btn btn-primary" (click)="close('update')">Update</button>
  </div>
