<div class="modal-header">
    <button type="button" class="btn-close" aria-label="Close" (click)="activeModal.dismiss('Cross click')"></button>
    <h4 class="modal-title text-center w-100">Upsert {{title}}</h4>
</div>
<div class="modal-body">
    <form #form="ngForm" (ngSubmit)="eventSubmit()">
        <ng-content body></ng-content>
        <div class="d-flex justify-content-center mt-3">
            <button type="submit" class="btn btn-primary d-flex justify-content-center">Submit</button>
        </div>
    </form>
    <div class="modal-footer">
        <button type="button" class="btn btn-secondary" (click)="activeModal.close('Close')">Close</button>
    </div>
</div>
