<div class="modal-header">
    <button type="button" class="btn-close" aria-label="Close" (click)="activeModal.dismiss('Cancelled')"></button>
    <h4 class="modal-title text-center w-100">Upsert {{title}}</h4>
</div>
@if (isReady) {
<div class="modal-body">
    <form #form="ngForm" (ngSubmit)="eventSubmit()">
        <ng-content body></ng-content>
        <div class="d-flex justify-content-center mt-3">
            <button type="submit" class="btn btn-primary d-flex justify-content-center">Submit</button>
        </div>
    </form>
    <div class="modal-footer">
        <button type="button" class="btn btn-secondary" (click)="activeModal.dismiss('Cancelled')">Cancell</button>
    </div>
</div>
} @else {
<div class="d-flex justify-content-center p-4">
    <div class="spinner-border" role="status">
        <span class="visually-hidden">Loading...</span>
    </div>
</div>
}
