<div class="table-responsive">
  <table class="table table-striped table-hover">
    <thead>
      <tr>
        <th *ngFor="let col of columns">{{ col.label }}</th>
        <th>Ações</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let row of data" (click)="onRowClick(row)" style="cursor: pointer">
        <td *ngFor="let col of columns">
          {{ formatCell(col, row) }}
        </td>
        <td>
          <button class="btn btn-sm btn-primary" (click)="onRowClick(row)">Editar</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
