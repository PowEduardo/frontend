<div class="table-responsive">
  <table class="table table-striped table-hover">
    <thead>
      <tr>
        @for (col of columns; track $index) {
        <th>{{ col.label }}</th>
        }
      </tr>
    </thead>
    <tbody>
      @for (row of data; track $index) {
      <tr (click)="onRowClick(row)" style="cursor: pointer">
        @for (col of columns; track $index) {
        <td>
          {{ formatCell(col, row) }}
        </td>
        }
        <td>
          <ng-container *ngIf="rowTemplate; else projectedColumn">
            <ng-container *ngTemplateOutlet="rowTemplate; context: { $implicit: row, index: $index }"></ng-container>
          </ng-container>
          <ng-template #projectedColumn>
            <!-- fallback: existing projected content (note: this is not repeated per-row) -->
            <ng-content select="[column]"></ng-content>
          </ng-template>
        </td>
      </tr>
      }
    </tbody>
  </table>
</div>
