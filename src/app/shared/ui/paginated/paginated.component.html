<!-- Pagination Controls -->
    <div class="d-flex justify-content-between align-items-center mt-4 ms-4 me-4 mb-4">
      <div>
        <button 
          class="btn btn-sm btn-outline-primary" 
          (click)="firstPage()"
          [disabled]="!canPreviousPage()">
          <i class="bi bi-chevron-double-left"></i> Primeira
        </button>
        <button 
          class="btn btn-sm btn-outline-primary ms-2" 
          (click)="previousPage()"
          [disabled]="!canPreviousPage()">
          <i class="bi bi-chevron-left"></i> Anterior
        </button>
      </div>
      
      <div class="text-center">
        <small class="text-muted">
          Página {{ getCurrentPageNumber() }} de {{ totalPages }} 
          <span class="ms-2">({{ itemsPerPage }} por página)</span>
        </small>
      </div>
      
      <div>
        <button 
          class="btn btn-sm btn-outline-primary" 
          (click)="nextPage()"
          [disabled]="!canNextPage()">
          Próxima <i class="bi bi-chevron-right"></i>
        </button>
        <button 
          class="btn btn-sm btn-outline-primary ms-2" 
          (click)="lastPage()"
          [disabled]="!canNextPage()">
          Última <i class="bi bi-chevron-double-right"></i>
        </button>
      </div>
    </div>
