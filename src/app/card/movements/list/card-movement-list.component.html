<div class="container-fluid mt-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h4 class="mb-0">Movimentos do Cartão</h4>
  </div>

  <!-- Filters -->
  <div class="row mb-3">
    <div class="col-md-3">
      <label class="form-label" for="types">Filtro:</label>
      <select id="types" class="form-select" [(ngModel)]="filter" (change)="applyFilter()">
        <option value="paid:false">Não Pagos</option>
        <option value="">Todos</option>
        <option value="paid:true">Pagos</option>
      </select>
    </div>
    <div class="col-md-3">
      <label for="sort" class="form-label">Ordenar por:</label>
      <select id="sort" class="form-select" [(ngModel)]="sortBy" (change)="applySort()">
        <option value="-date">Data (Recente)</option>
        <option value="date">Data (Antiga)</option>
        <option value="-value">Valor (Maior)</option>
        <option value="value">Valor (Menor)</option>
      </select>
    </div>
    <div class="col-md-3">
      <label for="apply" class="form-label d-block">&nbsp;</label>
      <button id="apply" class="btn btn-primary w-100" (click)="loadMovements()">
        <i class="bi bi-arrow-clockwise me-2"></i> Atualizar
      </button>
    </div>
    <div class="col-md-3">
      <label for="add" class="form-label d-block">&nbsp;</label>
      <button id="add" class="btn btn-primary w-100" (click)="addMovement()">
        <i class="bi bi-arrow-clockwise me-2"></i> Adicionar
      </button>
    </div>
  </div>

  <!-- Loading State -->
  @if (loading) {
    <div class="d-flex justify-content-center p-4">
      <div class="spinner-border" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>
  }

  <!-- Movements Table -->
  @if (!loading && !data.empty) {
    <app-table-paginated
        [columns]="columns"
        [data]="data.content"
        (rowSelected)="onValueSelected($event)"
        [actions]="movementActions"
        [currentPage]="data.pageable.pageNumber"
        [totalPages]="data.totalPages"
        (selectedPage)="searchData($event)"
        >
      </app-table-paginated>

    <!-- Total Summary -->
    <div class="alert alert-info mt-3 mb-0">
      <i class="bi bi-info-circle me-2"></i>
      <strong>Total de Movimentos Abertos:</strong> R$ {{ totalUnpaid | number: '1.2-2' }}
    </div>
  } @else if (!loading) {
    <div class="alert alert-info mb-0">
      <i class="bi bi-info-circle me-2"></i>
      Nenhum movimento encontrado
    </div>
  }
</div>
