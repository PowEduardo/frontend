<table class="table table-striped table-bordered" *ngIf="ready">
  <thead class="thead-dark">
    <tr>
      <th>
        Id
      </th>
      <th>
        Description
      </th>
      <th (click)="getInstallments('value')">
        Value
      </th>
      <th (click)="getInstallments('Installment')">
        Installment
      </th>
      <th (click)="getInstallments('movement.date')">Date</th>
      <th></th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let installment of installments">
      <td (click)="editMovement(installment)">
        {{installment.id}}
      </td>
      <td>
        {{installment.description}}
      </td>
      <td>
        {{installment.value | currency:'BRL':'symbol':'1.2-2'}}
      </td>
      <td>
        {{installment.installment}}/{{installment.movement.installment}}
      </td>
      <td>
        {{installment.date | date: 'dd/MM/yyyy'}}
      </td>
      <td (click)="edit(installment)">Edit</td>
      <td>
        <input type="checkbox">
      </td>
    </tr>
  </tbody>
</table>
