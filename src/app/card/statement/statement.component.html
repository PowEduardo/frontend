@if (this.isActive) {
  @if (loading) {
    <div class="d-flex justify-content-center p-4">
      <div class="spinner-border" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>
  } @else if (!data.empty) {
    <app-table-paginated
        [columns]="columns"
        [data]="data.content"
        (rowSelected)="onValueSelected($event)"
        [actions]="statementActions"
        [currentPage]="data.pageable.pageNumber"
        [totalPages]="data.totalPages"
        (selectedPage)="searchData($event)"
        >
      </app-table-paginated>
  } @else {
    <div class="alert alert-info m-4">
      <i class="bi bi-info-circle me-2"></i>
      Nenhuma fatura encontrada
    </div>
  }
} @else {
  <div class="d-flex justify-content-between align-items-center mb-4 mt-4 ms-4 me-4">
    <h5 class="mb-0">Detalhes da Fatura</h5>
    <button class="btn btn-success btn-sm" (click)="onAddMovement()">
      <i class="bi bi-plus-circle me-2"></i> Novo Movimento
    </button>
  </div>
  <router-outlet></router-outlet>
}
