<div class="container">
  <div class="row">
    <div class="col-md-4 font-weight-bold text-center py-3 bg-light border rounded" (click)="openMovements()">
      Movements
    </div>
    <div class="col-md-4 font-weight-bold text-center py-3 bg-light border rounded" (click)="openReturns()">
      Returns
    </div>
    <div class="col-md-4 font-weight-bold text-center py-3 bg-light border rounded" (click)="openIrpf()">
      IRPF
    </div>
  </div>
</div>
@if (isMovementsEnabled) {
  <app-movements [parentId]="assetId"></app-movements>
}
@if (isReturnsEnabled) {
  <app-returns [parentId]="assetId"></app-returns>
}
@if (isIrpfEnabled) {
  <app-irpf [parentId]="assetId"></app-irpf>
}
