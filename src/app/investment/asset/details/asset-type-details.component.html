<div class="asset-details-container">
  <div class="container">
    <h3 class="font-weight-bold text-center py-3 bg-light border rounded">Asset Details</h3>
    <div class="row">
      <button class="col-md-6 font-weight-bold text-center py-3 bg-light border rounded" (click)="openMovements()">
        Movements
      </button>
      <button class="col-md-6 font-weight-bold text-center py-3 bg-light border rounded" (click)="openReturns()">
        Returns
      </button>
    </div>
  </div>

  @if (isMovementsEnabled) {
    <app-movements [parentId]="0" [assetType]="type"></app-movements>
  }
  
  @if (isReturnsEnabled) {
    <app-returns [parentId]="0" [assetType]="type"></app-returns>
  }

  @if (loading) {
    <div class="d-flex justify-content-center p-4">
      <div class="spinner-border" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>
  } @else if (allAssets && allAssets.length > 0) {
    <div class="d-flex justify-content-end mb-3 mt-3">
      <button class="btn btn-success btn-sm" (click)="addAsset()">
        <i class="bi bi-plus-circle me-2"></i> Add Asset
      </button>
    </div>
    <app-table
      [columns]="columns"
      [data]="allAssets"
      [actions]="assetActions">
    </app-table>
    
    @if (showAssetOperations) {
      <div class="mt-4">
        <app-operations [assetId]="showAssetOperations"></app-operations>
      </div>
    }
  } @else {
    <div class="alert alert-info m-4">
      <i class="bi bi-info-circle me-2"></i>
      No assets found. <button class="btn btn-sm btn-info" (click)="addAsset()">Add one now</button>
    </div>
  }
</div>
