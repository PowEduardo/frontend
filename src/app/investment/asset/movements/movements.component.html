<app-movements-table>
  <ng-container headers>
    <th>Id</th>
    <th *ngIf="parentId===0">Asset</th>
    <th (click)="getMovements('-operation')">Operation</th>
    <th>Amount</th>
    <th>Unit Value</th>
    <th (click)="getMovements('-value')">Value</th>
    <th (click)="getMovements('date')">Date</th>
    <th (click)="addMovements()">+</th>
    <th></th>
  </ng-container>
  <ng-container row>
    <tr *ngFor="let movement of movements">
      <td>
        {{movement.id}}
      </td>
      <td *ngIf="parentId===0">
        {{movement.asset.ticker}}
      </td>
      <td>
        {{movement.operation}}
      </td>
      <td>
        {{movement.amount}}
      </td>
      <td>
        {{movement.unitValue | currency:'BRL':'symbol':'1.2-2'}}
      </td>
      <td>
        {{movement.value | currency:'BRL':'symbol':'1.2-2'}}
      </td>
      <td>
        {{movement.date | date:'dd/MM/yyyy'}}
      </td>
      <td (click)="updateMovements(movement)">+</td>
      <td>
        <button mat-icon-button (click)="deleteMovement(movement.id!)">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </tr>
  </ng-container>
</app-movements-table>
