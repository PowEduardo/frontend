<div class="returns-container">
  @if (loading) {
    <div class="d-flex justify-content-center p-4">
      <div class="spinner-border" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>
  } @else if (data.content.length > 0) {
    <div class="d-flex justify-content-end mb-3">
      <button class="btn btn-success btn-sm" (click)="addMovement()">
        <i class="bi bi-plus-circle me-2"></i> Add Return
      </button>
    </div>
    <app-table-paginated
        [columns]="columns"
        [data]="data.content"
        [actions]="returnActions"
        [currentPage]="data.pageable.pageNumber"
        [totalPages]="data.totalPages"
        (selectedPage)="searchData($event)"
        >
      </app-table-paginated>
  } @else {
    <div class="alert alert-info m-4">
      <i class="bi bi-info-circle me-2"></i>
      No returns found. <button class="btn btn-sm btn-info" (click)="addMovement()">Add one now</button>
    </div>
  }
</div>
