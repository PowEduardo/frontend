<app-movement-upsert [(model)]="model" [parentId]="parentId" (submitEvent)="onSubmit()">
  <div class="form-group">
    <label for="exDividendDate">Ex-Dividend Date</label>
    <input type="date" class="form-control" id="exDividendDate" name="exDividendDate" [(ngModel)]="model.exDividendDate"
      placeholder="Ex-Dividend Date">
  </div>
  <label for="operation">Operation</label>
  <div class="form-group">
    <select class="form-control" id="operation" name="operation" [(ngModel)]="model.operation">
      <option *ngFor="let operation of movementTypes" [value]="operation">{{operation}}</option>
    </select>
  </div>
  <div class="form-group">
    <label for="amount">Amount</label>
    <input type="number" class="form-control" id="amount" name="amount" [(ngModel)]="model.amount" placeholder="32"
      (input)="calculateValue()">
  </div>
  <div class="form-group">
    <label for="unitValue">Unit Value</label>
    <input type="number" class="form-control" id="unitValue" name="unitValue" [(ngModel)]="model.unitValue"
      placeholder="0.12" (input)="calculateValue()">
  </div>
  <div class="form-group" *ngIf="model.operation === 'JCP'">
    <label for="irFee">Ir Fee</label>
    <input type="number" class="form-control" id="irFee" name="irFee" [(ngModel)]="model.irFee" placeholder="10"
      (input)="calculateValue()">
  </div>
</app-movement-upsert>
