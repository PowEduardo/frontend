@if (pieValues !== undefined) {
  <app-pie [pieChartData]="pieValues"></app-pie>
}
<app-consolidate (pieValues)="pieValues = $event" (choosedAssetType)="choosedType = $event"></app-consolidate>
@if (choosedType) {
  <app-asset-type-details (pieValuesChange)="pieValues = $event"
  [type]="choosedType"></app-asset-type-details>
}
