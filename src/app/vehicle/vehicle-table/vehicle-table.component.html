<div class="container">
  <table class="table table-striped table-bordered">
    <thead class="thead-dark">
      <tr>
        <th class="text-center">Id</th>
        <th class="text-center">Manufacturer</th>
        <th class="text-center">Model</th>
        <th class="text-center">Version</th>
        <th class="text-center">Year</th>
        <th class="text-center">Milage</th>
        <th class="text-center">Value</th>
        <th class="text-center"><input type="checkbox" [checked]="selectedValues.length === list.length" (click)="selectAll()"></th>
      </tr>
    </thead>
    @if (list.length > 0) {
      <tbody>
        @for (model of list; track model) {
          <tr>
            <td class="text-center">{{model.id}}</td>
            <td>{{model.manufacturer}}</td>
            <td>{{model.model}}</td>
            <td class="text-center">{{model.version}}</td>
            <td class="text-center">{{model.year}}</td>
            <td class="text-center">{{model.milage}}</td>
            <td class="text-center">{{model.value}}</td>
            <td class="text-center">
              <input type="checkbox" [checked]="selectedValues.includes(model.id!)" (click)="selectOne(model.id!)">
            </td>
          </tr>
        }
      </tbody>
    }
  </table>
</div>
