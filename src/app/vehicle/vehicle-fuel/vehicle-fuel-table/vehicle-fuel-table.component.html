<div class="container">
    <table class="table table-striped table-bordered">
        <thead class="thead-dark">
            <tr>
                <th class="text-center">Id</th>
                <th class="text-center">Date</th>
                <th class="text-center">Description</th>
                <th class="text-center">Milage</th>
                <th class="text-center">Liters</th>
                <th class="text-center">Price</th>
                <th class="text-center">Value</th>
                <th class="text-center">Type</th>
                <th class="text-center">Consumption</th>
                <th class="text-center"><input type="checkbox" [checked]="selectedValues.length === list.length"
                        (click)="selectAll()"></th>
            </tr>
        </thead>
        <tbody *ngIf="list.length > 0">
            <tr *ngFor="let model of list">
                <td class="text-center">{{model.id}}</td>
                <td>{{model.date}}</td>
                <td>{{model.description}}</td>
                <td class="text-center">{{model.milage}}</td>
                <td class="text-center">{{model.liters}}</td>
                <td class="text-center">{{model.price | currency:'BRL':'symbol':'1.2-2'}}</td>
                <td class="text-center">{{model.value | currency:'BRL':'symbol':'1.2-2'}}</td>
                <td class="text-center">{{model.type}}</td>
                <td class="text-center">{{model.consumption}}</td>
                <td class="text-center">
                    <input type="checkbox" [checked]="selectedValues.includes(model.id!)"
                        (click)="selectOne(model.id!)">
                </td>
            </tr>
        </tbody>
    </table>
</div>
