@if (entitySelected) {
  <app-submenu [submenuItems]="submenuItems"><app-choose-vehicle (selectedVehicleIdEmitter)="changeEntitySelected($event)"></app-choose-vehicle></app-submenu>
}
@if (!entitySelected) {
  <div>
    <div class="container my-4">
      <div class="row">
        @for (entity of entities; track entity) {
          <!-- TODO: create component to window cards-->
          <div class="col-12 col-md-6 mb-3 ">
            <button class="card w-100 h-100 p-3 btn btn-light" (click)="changeEntitySelected(entity.id!)">
              <div class="card-body">
                <h5 class="card-title mt-2 ">{{ entity.model }}</h5>
              </div>
            </button>
          </div>
        }
        <div class="col-12 col-md-6 mb-3 ">
          <button class="card w-100 h-100 p-3 btn btn-light" (click)="null">
            <div class="card-body">
              <h5 class="card-title mt-2 ">+</h5>
            </div>
          </button>
        </div>
      </div>
    </div>
  </div>
}
<router-outlet></router-outlet>
