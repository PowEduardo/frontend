<h4 class="text text-center">Vehicle Parts</h4>
<app-choose-vehicle (selectedVehicleIdEmitter)="onVehicleSelected($event)"></app-choose-vehicle>
<div *ngIf="parentId">
  <app-vehicle-part-table [list]="list" (selectedValuesEmitter)="selectedValues = $event"></app-vehicle-part-table>
  <div class="text text-center" *ngIf="selectedValues.length === 0">
    <button class="btn btn-primary" (click)="create()">Add Part</button>
  </div>
  <div class="text text-center" *ngIf="selectedValues.length > 0">
    <button class="btn btn-primary" (click)="manage()">Manage Part</button>
  </div>
</div>
