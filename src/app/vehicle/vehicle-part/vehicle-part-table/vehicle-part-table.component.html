<div class="container">
    <table class="table table-striped table-bordered">
        <thead class="thead-dark">
            <tr>
                <th class="text-center">Id</th>
                <th class="text-center">description</th>
                <th class="text-center">isUpgrade</th>
                <th class="text-center">partNumber</th>
                <th class="text-center">shop</th>
                <th class="text-center">Value</th>
                <th class="text-center"><input type="checkbox" [checked]="selectedValues.length === list.length" (click)="selectAll()"></th>
            </tr>
        </thead>
        <tbody *ngIf="list.length > 0">
            <tr *ngFor="let model of list">
                <td class="text-center">{{model.id}}</td>
                <td>{{model.description}}</td>
                <td>{{model.isUpgrade}}</td>
                <td class="text-center">{{model.partNumber}}</td>
                <td class="text-center">{{model.shop}}</td>
                <td class="text-center">{{model.value | currency:'BRL':'symbol':'1.2-2'}}</td>
                <td class="text-center">
                    <input type="checkbox" [checked]="selectedValues.includes(model.id!)" (click)="selectOne(model.id!)">
                </td>
            </tr>
        </tbody>
    </table>
</div>
