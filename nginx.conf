server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.server.html;

    # Serve static files directly
    location ~* \.(js|mjs|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|json)$ {
        try_files $uri =404;
        add_header Content-Type application/javascript;
    }

    # Fallback for all other requests (client-side routes)
    location / {
        try_files $uri $uri/ /index.server.html;
    }
}